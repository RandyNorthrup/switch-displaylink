# Make a DisplayLink/evdi unplug hang leave a readable trace.
# A hang only lands in ramoops (/sys/fs/pstore) if the kernel panics and
# warm-reboots by itself -- a long power-button hold cuts DRAM and wipes it.
# Install: /etc/sysctl.d/99-dl-crash-debug.conf, then `sudo sysctl --system`.

# Send every printk (incl. evdi [I]/[D]) to the console -> console-ramoops.
kernel.printk = 8 4 1 7
# Turn the "frozen but not locked-up" cases into panics too.
kernel.panic_on_oops = 1
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 20
kernel.softlockup_panic = 1
kernel.softlockup_all_cpu_backtrace = 1
kernel.hardlockup_all_cpu_backtrace = 1
# Auto-reboot 5 s after panic (warm reset keeps ramoops).
kernel.panic = 5
