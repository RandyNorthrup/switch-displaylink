# Isolated test: a second X server (:1) rendering only into the DisplayLink
# evdi card via modesetting (shadow fb, no glamor). No input, no VT switch.
Section "ServerFlags"
    Option "AutoAddGPU"     "false"
    Option "AutoAddDevices" "false"
    Option "DontVTSwitch"   "true"
    Option "BlankTime"      "0"
    Option "StandbyTime"    "0"
    Option "SuspendTime"    "0"
    Option "OffTime"        "0"
EndSection

Section "Device"
    Identifier "evdi0"
    Driver     "modesetting"
    Option     "kmsdev"      "/dev/dri/by-path/platform-evdi.0-card"
    Option     "AccelMethod" "none"
    Option     "PageFlip"    "false"
EndSection

Section "Monitor"
    Identifier "dock0"
EndSection

Section "Screen"
    Identifier "evdi-screen"
    Device     "evdi0"
    Monitor    "dock0"
    DefaultDepth 24
EndSection

Section "ServerLayout"
    Identifier "evdi-only"
    Screen     "evdi-screen"
EndSection
